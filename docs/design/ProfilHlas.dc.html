<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>JakoTáta – profil táty, hlas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF6B57}a:hover{color:#FF8A7A}
.glass{-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid transparent;box-shadow:0 10px 34px rgba(0,0,0,0.22)}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #2B2333; font-family: Nunito, system-ui, sans-serif; color: {{ink}}">

<svg width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; filter: blur(14px); transform: scale(1.08)" aria-hidden="true">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2333"/><stop offset="1" stop-color="#3A2C33"/></linearGradient>
<radialGradient id="lamp" cx="0.82" cy="0.2" r="0.55"><stop offset="0" stop-color="#FFB86B" stop-opacity="0.55"/><stop offset="1" stop-color="#FFB86B" stop-opacity="0"/></radialGradient>
<radialGradient id="win" cx="0.05" cy="0.38" r="0.5"><stop offset="0" stop-color="#7FB2FF" stop-opacity="0.3"/><stop offset="1" stop-color="#7FB2FF" stop-opacity="0"/></radialGradient>
</defs>
<rect width="390" height="844" fill="url(#wall)"/>
<rect width="390" height="844" fill="url(#lamp)"/>
<rect width="390" height="844" fill="url(#win)"/>
<path d="M30 844 C 40 700 110 650 195 650 C 280 650 350 700 360 844 Z" fill="#34507A"/>
<ellipse cx="195" cy="430" rx="92" ry="114" fill="#D9A47F"/>
<path d="M104 410 C 100 330 140 300 195 298 C 252 298 292 330 286 410 C 278 372 262 352 240 344 C 210 352 170 352 150 344 C 128 352 110 372 104 410 Z" fill="#3B2A20"/>
</svg>

<div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 12px">
<button class="glass" aria-label="Zpět" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; padding: 0; background: {{glass}}; border-color: {{line}}; color: {{ink}}">
<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
<div style="display: flex; flex-direction: column">
<span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; color: #FFFFFF">Profil táty</span>
<span style="font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.85)">Krok 3 ze 4 · Hlas</span>
</div>
</div>
<div aria-hidden="true" style="position: absolute; top: 76px; left: 16px; right: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<span style="height: 5px; border-radius: 3px; background: {{accent}}"></span>
<span style="height: 5px; border-radius: 3px; background: {{accent}}"></span>
<span style="height: 5px; border-radius: 3px; background: {{accent}}"></span>
<span style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.3)"></span>
</div>

<section class="glass" aria-label="Text ke čtení" style="position: absolute; top: 100px; left: 12px; right: 12px; border-radius: 28px; padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; background: {{glass}}; border-color: {{line}}; color: {{ink}}">
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: {{soft}}">Přečti nahlas, klidně a vlastním hlasem</span>
<p style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 24px; line-height: 1.35; color: {{done}}">Ahoj Viktorko, dnes je krásný den.</p>
<p style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.35; color: {{ink}}; padding: 4px 10px; margin-left: -10px; margin-right: -10px; border-radius: 12px; background: {{hi}}">Půjdeme spolu k rybníku a uvidíme kachny,</p>
<p style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 24px; line-height: 1.35; color: {{soft}}">labutě a možná i veverku. Pak si uvaříme kakao a zahrajeme si Člověče, nezlob se.</p>
</section>

<section class="glass" aria-label="Kvalita nahrávky" style="position: absolute; left: 12px; right: 12px; bottom: 148px; border-radius: 28px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; background: {{glass}}; border-color: {{line}}; color: {{ink}}">
<div style="display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="flex: 1; display: flex; align-items: center; gap: 3px; height: 32px">
<sc-for list="{{meter}}" as="b" hint-placeholder-count="24">
<span style="flex: 1; border-radius: 2px; height: {{b.h}}; background: {{b.c}}"></span>
</sc-for>
</div>
<span role="timer" style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 20px; white-space: nowrap">0:23 <span style="font-size: 14px; color: {{soft}}">/ 0:45</span></span>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<li style="display: flex; align-items: center; justify-content: center; gap: 5px; height: 34px; border-radius: 17px; font-size: 13px; font-weight: 800; background: {{track}}">
<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; color: {{accent}}; stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Bez šumu
</li>
<li style="display: flex; align-items: center; justify-content: center; gap: 5px; height: 34px; border-radius: 17px; font-size: 13px; font-weight: 800; background: {{track}}">
<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; color: {{accent}}; stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Hlasitost
</li>
<li style="display: flex; align-items: center; justify-content: center; gap: 5px; height: 34px; border-radius: 17px; font-size: 13px; font-weight: 800; background: {{track}}; color: {{soft}}">Řeč 14 / 20 s</li>
</ul>
</section>

<div class="glass" style="position: absolute; left: 12px; right: 12px; bottom: 16px; border-radius: 32px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: {{glass}}; border-color: {{line}}; color: {{ink}}">
<button style="justify-self: start; height: 48px; border-radius: 24px; border: 0; display: flex; align-items: center; gap: 6px; padding: 0 14px; font-weight: 800; font-size: 14px; background: {{track}}; color: {{ink}}">
<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4v4h4"></path></svg>Znovu
</button>
<button aria-label="Pozastavit nahrávání hlasu" style="width: 84px; height: 84px; border-radius: 42px; border: 4px solid {{ring}}; padding: 0; display: flex; align-items: center; justify-content: center; background: transparent">
<span style="width: 64px; height: 64px; border-radius: 32px; display: flex; align-items: center; justify-content: center; gap: 6px; background: {{accent}}">
<span style="width: 7px; height: 22px; border-radius: 3px; background: #FFFFFF"></span>
<span style="width: 7px; height: 22px; border-radius: 3px; background: #FFFFFF"></span>
</span>
</button>
<button disabled style="justify-self: end; height: 48px; border-radius: 24px; border: 1px solid {{line}}; padding: 0 18px; font-weight: 800; font-size: 14px; background: transparent; color: {{soft}}; cursor: default">Dál</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"svetly":{"editor":"boolean","default":false,"section":"Vzhled"},"accent":{"editor":"color","default":"#FF6B57","options":["#FF6B57","#8B5CF6","#14B8A6","#F59E0B"],"section":"Vzhled"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = !!this.props.svetly;
    const t = light
      ? { glass: 'rgba(255,255,255,0.74)', line: 'rgba(255,255,255,0.9)', ink: '#1B1724', soft: '#4A4458', done: 'rgba(27,23,36,0.45)', hi: 'rgba(27,23,36,0.07)', track: 'rgba(27,23,36,0.08)', ring: '#1B1724', rest: 'rgba(27,23,36,0.18)' }
      : { glass: 'rgba(22,18,30,0.46)', line: 'rgba(255,255,255,0.18)', ink: '#FFFFFF', soft: 'rgba(255,255,255,0.78)', done: 'rgba(255,255,255,0.45)', hi: 'rgba(255,255,255,0.1)', track: 'rgba(255,255,255,0.12)', ring: '#FFFFFF', rest: 'rgba(255,255,255,0.22)' };
    const accent = this.props.accent || '#FF6B57';
    const levels = [6, 10, 16, 22, 28, 24, 30, 26, 18, 12, 20, 28, 32, 26, 20, 14, 10, 16, 22, 18, 12, 8, 6, 4];
    const meter = levels.map((h, i) => ({ h: h + 'px', c: i < 18 ? accent : t.rest }));
    return Object.assign({}, t, { accent: accent, meter: meter });
  }
}
</script>
</body>
</html>
