<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>JakoTáta – profil táty, fotky</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF6B57}a:hover{color:#FF8A7A}
.glass{-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid transparent;box-shadow:0 10px 34px rgba(0,0,0,0.22)}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #2B2333; font-family: Nunito, system-ui, sans-serif; color: {{ink}}">

<svg width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0" role="img" aria-label="Živý obraz kamery: táta se fotí do profilu">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2333"/><stop offset="1" stop-color="#3A2C33"/></linearGradient>
<radialGradient id="lamp" cx="0.82" cy="0.2" r="0.55"><stop offset="0" stop-color="#FFB86B" stop-opacity="0.5"/><stop offset="1" stop-color="#FFB86B" stop-opacity="0"/></radialGradient>
<radialGradient id="win" cx="0.05" cy="0.38" r="0.5"><stop offset="0" stop-color="#7FB2FF" stop-opacity="0.28"/><stop offset="1" stop-color="#7FB2FF" stop-opacity="0"/></radialGradient>
<pattern id="stub" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.8" fill="#4A2D1E" fill-opacity="0.6"/></pattern>
</defs>
<rect width="390" height="844" fill="url(#wall)"/>
<rect width="390" height="844" fill="url(#lamp)"/>
<rect width="390" height="844" fill="url(#win)"/>
<g transform="translate(0 -30)">
<path d="M30 874 C 40 730 110 680 195 680 C 280 680 350 730 360 874 Z" fill="#34507A"/>
<path d="M160 560 L 230 560 L 236 690 C 214 704 176 704 154 690 Z" fill="#CF9A76"/>
<ellipse cx="103" cy="440" rx="13" ry="22" fill="#CF9A76"/>
<ellipse cx="287" cy="440" rx="13" ry="22" fill="#CF9A76"/>
<ellipse cx="195" cy="430" rx="92" ry="114" fill="#D9A47F"/>
<path d="M112 456 C 118 540 160 566 195 566 C 230 566 272 540 278 456 C 262 500 236 516 195 516 C 154 516 128 500 112 456 Z" fill="url(#stub)"/>
<path d="M104 410 C 100 330 140 300 195 298 C 252 298 292 330 286 410 C 278 372 262 352 240 344 C 210 352 170 352 150 344 C 128 352 110 372 104 410 Z" fill="#3B2A20"/>
<path d="M138 392 C 150 382 170 380 182 386" fill="none" stroke="#3E2518" stroke-width="7" stroke-linecap="round"/>
<path d="M208 386 C 220 380 240 382 252 392" fill="none" stroke="#3E2518" stroke-width="7" stroke-linecap="round"/>
<ellipse cx="161" cy="418" rx="13" ry="8" fill="#FFFFFF"/>
<circle cx="162" cy="418" r="5.5" fill="#4B3A2A"/>
<ellipse cx="229" cy="418" rx="13" ry="8" fill="#FFFFFF"/>
<circle cx="228" cy="418" r="5.5" fill="#4B3A2A"/>
<path d="M195 424 C 192 446 184 460 186 468 C 190 474 200 474 206 470" fill="none" stroke="#A86F4F" stroke-width="3" stroke-linecap="round"/>
<path d="M166 488 C 178 480 188 482 195 486 C 202 482 212 480 224 488 C 214 492 204 492 195 490 C 186 492 176 492 166 488 Z" fill="#4A2D1E" fill-opacity="0.9"/>
<path d="M174 502 C 186 507 204 507 216 502" fill="none" stroke="#8E4B3E" stroke-width="4" stroke-linecap="round"/>
</g>
<ellipse cx="195" cy="400" rx="114" ry="142" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2.5" stroke-dasharray="8 7"/>
<ellipse cx="195" cy="400" rx="114" ry="142" fill="none" stroke="{{accent}}" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="68 100" transform="rotate(-90 195 400)"/>
</svg>

<div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 12px">
<button class="glass" aria-label="Zpět" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; padding: 0; background: {{glass}}; border-color: {{line}}; color: {{ink}}">
<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
<div style="display: flex; flex-direction: column">
<span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; color: #FFFFFF; text-shadow: 0 1px 8px rgba(0,0,0,0.5)">Profil táty</span>
<span style="font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.85); text-shadow: 0 1px 8px rgba(0,0,0,0.5)">Krok 2 ze 4 · Fotky</span>
</div>
</div>
<div aria-hidden="true" style="position: absolute; top: 76px; left: 16px; right: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<span style="height: 5px; border-radius: 3px; background: {{accent}}"></span>
<span style="height: 5px; border-radius: 3px; background: {{accent}}"></span>
<span style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.3)"></span>
<span style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.3)"></span>
</div>

<ol aria-label="Snímky" style="position: absolute; top: 100px; left: 0; right: 0; margin: 0; padding: 0; list-style: none; display: flex; justify-content: center; gap: 8px">
<li aria-current="step" class="glass" style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; font-size: 13px; font-weight: 800; background: {{onBg}}; border-color: {{line}}; color: {{onInk}}">1 · Zepředu</li>
<li class="glass" style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; font-size: 13px; font-weight: 800; background: {{glass}}; border-color: {{line}}; color: {{ink}}">2 · Vlevo</li>
<li class="glass" style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; font-size: 13px; font-weight: 800; background: {{glass}}; border-color: {{line}}; color: {{ink}}">3 · Vpravo</li>
</ol>

<section class="glass" style="position: absolute; left: 12px; right: 12px; bottom: 16px; border-radius: 32px; padding: 18px 18px 18px; display: flex; flex-direction: column; gap: 12px; background: {{glass}}; border-color: {{line}}; color: {{ink}}">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 23px; line-height: 1.15">Podívej se rovně do kamery</h1>
<p style="margin: 0; font-size: 14px; font-weight: 700; color: {{soft}}">Vyfotím sám, až bude všechno v pořádku.</p>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
<li style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700">
<span style="width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: {{accent}}; color: #FFFFFF"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
Obličej je v oválu
</li>
<li style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700">
<span style="width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: {{accent}}; color: #FFFFFF"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
Dost světla, bez stínů
</li>
<li style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: {{soft}}">
<span style="width: 28px; height: 28px; border-radius: 14px; box-sizing: border-box; border: 2px dashed {{soft}}"></span>
Neutrální výraz, pusa zavřená
</li>
</ul>
<button style="height: 48px; border-radius: 24px; border: 1px solid {{line}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 15px; background: {{track}}; color: {{ink}}">
<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg>
Vybrat fotku z galerie
</button>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"svetly":{"editor":"boolean","default":false,"section":"Vzhled"},"accent":{"editor":"color","default":"#FF6B57","options":["#FF6B57","#8B5CF6","#14B8A6","#F59E0B"],"section":"Vzhled"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = !!this.props.svetly;
    const t = light
      ? { glass: 'rgba(255,255,255,0.72)', line: 'rgba(255,255,255,0.9)', ink: '#1B1724', soft: '#4A4458', onBg: '#1B1724', onInk: '#FFFFFF', track: 'rgba(27,23,36,0.08)' }
      : { glass: 'rgba(22,18,30,0.42)', line: 'rgba(255,255,255,0.18)', ink: '#FFFFFF', soft: 'rgba(255,255,255,0.8)', onBg: '#FFFFFF', onInk: '#1B1724', track: 'rgba(255,255,255,0.12)' };
    return Object.assign({}, t, { accent: this.props.accent || '#FF6B57' });
  }
}
</script>
</body>
</html>
