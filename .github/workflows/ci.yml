name: CI

# Zadání kap. 9 a 10: build, lint, unit testy a testy C++ na hostu na každý push.
on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, lint
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jakotata-debug
          path: app/build/outputs/apk/debug/*.apk

  native-host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S native/voice -B build-host -DJAKOTATA_HOST_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-host -j
      - name: Test
        run: ctest --test-dir build-host --output-on-failure
